name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Firestore rules test tools
        run: npm install --no-save @firebase/rules-unit-testing firebase-tools
      - name: Test Firestore access isolation
        run: npx firebase emulators:exec --only firestore --project demo-edunexus "node --test tests/firestore-rules.test.mjs"
      - name: Type-check
        run: npm run lint
      - name: Build Cloud Functions
        run: npm --prefix functions install && npm --prefix functions run build
      - name: Build production bundle
        run: npm run build
